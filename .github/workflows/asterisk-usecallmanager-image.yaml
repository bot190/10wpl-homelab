---
name: Asterisk USECALLMANAGER Image

on:
  push:
    branches: ["main"]
    paths:
      - containers/asterisk-usecallmanager/**
      - .github/workflows/asterisk-usecallmanager-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: containers/asterisk-usecallmanager
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/asterisk-usecallmanager:22.10.0
            ghcr.io/${{ github.repository_owner }}/asterisk-usecallmanager:22
