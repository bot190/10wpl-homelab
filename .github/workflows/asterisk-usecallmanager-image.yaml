---
name: Asterisk USECALLMANAGER Image

on:
  push:
    branches: ["main"]
    paths:
      - containers/asterisk-usecallmanager/**
      - .github/workflows/asterisk-usecallmanager-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: containers/asterisk-usecallmanager
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/asterisk-usecallmanager:22.10.0
            ghcr.io/${{ github.repository_owner }}/asterisk-usecallmanager:22
