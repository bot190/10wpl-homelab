---
name: Asterisk USECALLMANAGER Image

on:
  push:
    branches: ["main"]
    paths:
      - containers/asterisk-usecallmanager/**
      - .github/workflows/asterisk-usecallmanager-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: containers/asterisk-usecallmanager
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/asterisk-usecallmanager:22.10.0
            ghcr.io/${{ github.repository_owner }}/asterisk-usecallmanager:22
