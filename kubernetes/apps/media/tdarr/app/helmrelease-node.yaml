---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tdarr-node
  namespace: media
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: tdarr
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  dependsOn:
    - name: tdarr
      namespace: media
  values:
    controllers:
      node:
        type: daemonset
        containers:
          app:
            image:
              repository: ghcr.io/haveagitgat/tdarr_node
              tag: 2.86.01
            env:
              TZ: "${TIMEZONE}"
              PUID: "${MEDIA_SECURITY_CONTEXT_RUN_AS_USER}"
              PGID: "${MEDIA_SECURITY_CONTEXT_RUN_AS_GROUP}"
              UMASK_SET: "002"
              inContainer: "true"
              ffmpegVersion: "7"
              nodeName:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              serverURL: http://tdarr.media.svc.cluster.local:8266
              nodeType: mapped
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 8Gi
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
    defaultPodOptions:
      securityContext:
        fsGroup: "${MEDIA_SECURITY_CONTEXT_RUN_AS_GROUP}"
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      transcode-cache:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: tdarr-transcode-cache
        globalMounts:
          - path: /temp
      tv:
        enabled: true
        type: custom
        volumeSpec:
          nfs:
            path: /warehouse/media/tv
            server: "${NFS_SERVER}"
        globalMounts:
          - path: /media/tv
      movies:
        enabled: true
        type: custom
        volumeSpec:
          nfs:
            path: /warehouse/media/movies
            server: "${NFS_SERVER}"
        globalMounts:
          - path: /media/movies
      music:
        enabled: true
        type: custom
        volumeSpec:
          nfs:
            path: /warehouse/media/music
            server: "${NFS_SERVER}"
        globalMounts:
          - path: /media/music
