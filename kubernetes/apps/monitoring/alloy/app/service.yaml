---
apiVersion: v1
kind: Service
metadata:
  name: alloy-syslog
  annotations:
    metallb.io/loadBalancerIPs: 192.168.16.124
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/name: alloy
  ports:
    - name: syslog-tcp
      port: 514
      targetPort: 1514
      protocol: TCP
    - name: syslog-udp
      port: 514
      targetPort: 1514
      protocol: UDP
