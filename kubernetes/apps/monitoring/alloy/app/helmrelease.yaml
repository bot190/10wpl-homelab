---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: 1.11.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controller:
      type: daemonset
      volumes:
        extra:
          - name: tmp
            emptyDir: {}
    global:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: "${SECURITY_CONTEXT_RUN_AS_USER}"
        runAsGroup: "${SECURITY_CONTEXT_RUN_AS_GROUP}"
        fsGroup: "${SECURITY_CONTEXT_RUN_AS_GROUP}"
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    alloy:
      enableReporting: false
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      mounts:
        extra:
          - name: tmp
            mountPath: /tmp
      configMap:
        content: |
          logging {
            level  = "info"
            format = "logfmt"
          }

          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              regex         = sys.env("K8S_NODE_NAME")
              action        = "keep"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "job"
            }
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.write.default.receiver]
          }

          loki.relabel "syslog" {
            forward_to = []

            rule {
              source_labels = ["__syslog_message_hostname"]
              target_label  = "host"
            }

            rule {
              source_labels = ["__syslog_message_app_name"]
              target_label  = "app"
            }

            rule {
              source_labels = ["__syslog_message_facility"]
              target_label  = "facility"
            }

            rule {
              source_labels = ["__syslog_message_severity"]
              target_label  = "severity"
            }
          }

          loki.source.syslog "rfc5424_udp" {
            listener {
              address                         = "0.0.0.0:1514"
              protocol                        = "udp"
              syslog_format                   = "rfc5424"
              use_incoming_timestamp          = true
              # rfc3164_default_to_current_year = true
              labels = {
                job      = "syslog",
                protocol = "udp",
              }
            }

            relabel_rules = loki.relabel.syslog.rules
            forward_to    = [loki.write.default.receiver]
          }

          loki.source.syslog "rfc5424_tcp" {
            listener {
              address                = "0.0.0.0:1514"
              protocol               = "tcp"
              syslog_format          = "rfc5424"
              use_incoming_timestamp = true
              labels = {
                job      = "syslog",
                protocol = "tcp",
              }
            }

            relabel_rules = loki.relabel.syslog.rules
            forward_to    = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
            }
          }
    serviceMonitor:
      enabled: true
