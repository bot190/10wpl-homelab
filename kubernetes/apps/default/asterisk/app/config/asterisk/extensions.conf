[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]
RING_TIMEOUT=25

[internal]
exten => 800,1,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

exten => 600,1,Dial(SIP/100&SIP/101,${RING_TIMEOUT})
 same => n,Hangup()

exten => _10[01],1,Dial(SIP/${EXTEN},${RING_TIMEOUT})
 same => n,VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()

exten => 100,hint,SIP/100
exten => 101,hint,SIP/101
